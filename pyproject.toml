[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-mvp"
version = "0.1.0"
description = "ALPHA - agente pessoal local-first com voz, memória, arquivos e web"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy[asyncio]>=2.0.30,<3.0",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.20,<1.0",
  "alembic>=1.13,<2.0",
  "httpx>=0.27,<1.0",
  "pgvector>=0.3,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "faster-whisper>=1.0.3,<2.0",
  "piper-tts>=1.2.0,<2.0",
  "sounddevice>=0.4.6,<1.0",
  "numpy>=1.26,<3.0",
  "pypdf>=5.0,<6.0",
  "python-docx>=1.1,<2.0",
  "croniter>=2.0,<3.0",
  "apscheduler>=3.10,<4.0",
  "rich>=13.7,<16.0",
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "anyio>=4.4,<5.0",
  "pywinauto>=0.6.8,<1.0; platform_system=='Windows'",
  "ultralytics>=8.2,<9.0",
  "opencv-python>=4.9,<5.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1.0"]

[project.scripts]
alpha = "app.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
