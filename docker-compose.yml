services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ALPHA
      POSTGRES_PASSWORD: ALPHA
      POSTGRES_DB: ALPHA
    ports:
      - "5432:5432"
    volumes:
      - alpha_postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ALPHA:ALPHA@postgres:5432/ALPHA
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  alpha_postgres_data:
