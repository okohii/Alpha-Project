<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ALPHA</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">ALPHA</div>
        <div class="status-row">
          <span id="online-dot" class="dot online"></span
          ><span id="online-label">ONLINE</span>
        </div>
        <div class="panel">
          <h2>Conversas</h2>
          <div id="conversation-list" class="conversation-list"></div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <div class="title">ALPHA</div>
            <div id="model-label" class="subtitle">Modelo local</div>
          </div>
          <button id="refresh-button" class="ghost">Atualizar</button>
        </header>
        <section id="messages" class="messages"></section>
        <section class="composer">
          <button id="alexa-mode-button" class="voice-mode" title="Modo Alexa">
            Alexa
          </button>
          <button
            id="assistant-mode-button"
            class="voice-mode"
            title="Modo assistente contínuo"
          >
            Assistente
          </button>
          <button id="mic-button" class="mic" title="Microfone manual">
            🎙
          </button>
          <input
            id="message-input"
            type="text"
            placeholder="Digite uma mensagem..."
          />
          <button id="send-button" class="send">➤</button>
        </section>
        <section class="events panel">
          <h2>Eventos</h2>
          <pre id="events-log"></pre>
        </section>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
