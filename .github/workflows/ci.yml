name: ci

on:
  push:
    branches: [main, master, feature-*]
  pull_request:

jobs:
  unit-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check app tests
      - name: Security regression (adversarial)
        run: pytest tests/unit/security -q -p no:cacheprovider
      - name: Unit + integration suite
        run: pytest tests -q -p no:cacheprovider --ignore=tests/unit/speech/test_voice.py --ignore=tests/unit/perception/test_stt_cuda_fallback.py --ignore=tests/unit/speech/test_audio_io.py